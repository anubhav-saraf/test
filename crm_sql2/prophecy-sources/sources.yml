      description: "Identificador único a nivel local de la persona"
      dataType:
        type: "String"
    - name: "tipo_contacto"
      description: "Identifica que tipo de medio de contacto tiene el registro (Telé\
        fono, mail, dirección)"
      dataType:
        type: "String"
    - name: "valor_contacto"
      description: "Identifica el valor del contacto. En el caso de direcciones este\
        \ campo viaja vacío"
      dataType:
        type: "String"
    - name: "fecha_alta_contacto"
      description: "Fecha en la cual fue dado de alta en el sistema el valor_contacto."
      dataType:
        type: "Date"
    - name: "codigo_origen"
      description: "Identifica el código del sistema en el cual el registro fue cargado."
      dataType:
        type: "SmallInt"
    - name: "descripcion_origen"
      description: "Describe el campo codigo_origen."
      dataType:
        type: "String"
    - name: "descripcion_origen_extendido"
      description: "Da más información sobre el campo descripcion_origen, en el caso\
        \ de Altair detalla la tabla de donde sale el dato."
      dataType:
        type: "String"
    - name: "calle_domicilio"
      description: "Detalla la calle del domicilio."
      dataType:
        type: "String"
    - name: "numero_puerta"
      description: "Detalla el numero de puerta del domicilio."
      dataType:
        type: "String"
    - name: "resto_direccion"
      description: "Campo adicional para identificar propiedades que con calle y numero\
        \ de puerta no pueda ser identificada por ejemplo apartamentos."
      dataType:
        type: "String"
    - name: "localidad"
      description: "Detalla la localidad del domicilio."
      dataType:
        type: "String"
    - name: "descripcion_departamento"
      description: "Departamento del domicilio del cliente."
      dataType:
        type: "String"
    - name: "codigo_postal"
      description: "Detalla el código postal del domicilio."
      dataType:
        type: "String"
    - name: "pais_domicilio"
      description: "Detalla el país donde se encuentra el domicilio."
      dataType:
        type: "String"
    type: "table"
